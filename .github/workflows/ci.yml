name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint ist vorerst nicht-blockierend: der Bestand hat noch ~120 Verstöße
      # gegen die strengen react-hooks-Regeln. Nach deren Bereinigung
      # continue-on-error entfernen.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://qqkxlkrkbctexwnqjitx.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
